    <script type="text/javascript">
        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };
    </script>

## The Modular Synthesis Analogy

Hydra mirrors **modular synthesis**, but in code:
```
source → transformation → output

osc()       .rotate()     .out()
```

- **Source** = signal generator (oscillator, noise, shape...)
- **Transformation** = module (geometry, color, effects)
- **out()** = monitor output

> Functions are connected with `.` (dot notation)  
> <br>
>  Arguments = knob positions

## Your First Patch
```js
osc().out()
```

Add parameters:
```js
osc(10, 0.1, 0.5).out()
// osc(freq, sync, offset)
```
freq determines the frequency (i.e., how packed the stripes are), the second the sync (i.e., the scroll speed), and the third the offset, which adds color to the pattern.


Chain a transform:
```js
osc(10, 0.1, 0.5).rotate(0.5).out()
```

Keep adding:
```js
osc(10, 0.1, 0.5).rotate(0.5).pixelate(20, 20).out()
```

Geometry transforms **manipulate the coordinate space** of a texture — they move, scale, tile, and warp where pixels are sampled from


```
source → geometry transform → color transform → .out()
osc()    .rotate(0.5)         .color(1,0,0)     .out()
```

### `.rotate()`
```js
rotate( angle = 10, speed )
```

Rotates the texture. `angle` in radians. `speed` animates the rotation over time.
```js
osc(10, 0.1, 1).rotate(0.5).out()        // static rotation
osc(10, 0.1, 1).rotate(0, 0.1).out()     // continuous spin
osc(10, 0.1, 1).rotate(Math.PI / 4).out() // 45°
```

> `Math.PI` = 180°  ·  `Math.PI / 2` = 90°  ·  `Math.PI * 2` = full circle

### `P()` — mini-notation
```js
// sequence — steps through values each cycle
osc(10).kaleid(P("3 4 6 8")).out()

// subdivision — subdivides a step into faster values
osc(10).kaleid(P("3 [4 6 8]")).out()

// alternation — cycles through options every cycle
osc(10).rotate(P("<0 0.5 1>")).out()

// combine — rhythm on one param, pitch on another
osc(10, 0.1)
  .kaleid(P("3 4 6 8"))
  .rotate(P("<0 0.25 0.5 0.75>"))
  .out()
```
<!-- .element: style="font-size: 0.75em" -->

> Any Hydra numeric parameter accepts `P()` — sources, geometry, color, blending

        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            let hex = color.replace('#', '');

            // convert #fff => #ffffff
            if (hex.length == 3) {
                hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
            }

            const c_r = parseInt(hex.substr(0, 2), 16);
            const c_g = parseInt(hex.substr(2, 2), 16);
            const c_b = parseInt(hex.substr(4, 2), 16);
            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
            document.body.classList.add('has-light-background');
        } else {
            document.body.classList.add('has-dark-background');
        }
