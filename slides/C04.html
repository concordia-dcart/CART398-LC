    <script type="text/javascript">
        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };
    </script>

### What is a musical scale?

Music offers many possible pitches

A scale selects a subset of the available pitches

Using that subset makes a melody sound coherent, like it lives in one musical world

It is a practical rule for choosing pitches when you write or improvise

Different scales have different note spacings

Those spacings change the emotional associations people often report

## Arrow functions


An arrow function is JavaScript’s compact way to write a function (a piece of code you can pass around and call later). For example:

`x => x.rev()` means: define a function with one input called `x`, and return `x.rev()`

it is equivalent to writing

```haskell
function (x) {
  return x.rev()
}
```

Arrow functions are commonly used in Strudel, for example when applying variations

## Common uses of `.every()`

### Sequence speed

`.every(4, x => x.fast(2))`

`.every(4, x => x.slow(2))`

### Sample speed

`.every(3, x => x.speed(0.5))`

`.every(3, x => x.hurry(2))`

### Sequence variations

`.every(5, x => x.struct("x ~ x x"))`

This is _formal variation_, not random change.

One person develops a **high-register melody**, contrasting or complementing the low part.

A sample map is needed where you state which sample names exist (when you type in `s("...")`) and which audio files each name points to  (plus a `_base` URL).

```json
{
  "_base": "https://example.org/my-samples/",
  "bd": ["bd/01.wav", "bd/02.wav"],
  "hh": "hh/closed.wav",
  "sd": ["sd/a.wav", "sd/b.wav"]
}

```

After loading that, you can select the samples by name, and their variants with `:` (zero-based), e.g. `s("bd:0 bd:1 sd:0")`.

You can store this sample map in a `strudel.json` file and serve it in the root of the repository

When loading the repo in Strudel using `samples( ... )`, it will search for the JSON file and read the mappings!

In this exercise, you will create your own repository on Github.

You will:

1. Record, collect, or use four to six sounds
2. Organize them in folders
3. Create a repository on Github and clone it to your computer
4. Move the sounds into the local repository

6. Commit and push the changes
7. Enjoy!

    <script>
        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            let hex = color.replace('#', '');

            // convert #fff => #ffffff
            if (hex.length == 3) {
                hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
            }

            const c_r = parseInt(hex.substr(0, 2), 16);
            const c_g = parseInt(hex.substr(2, 2), 16);
            const c_b = parseInt(hex.substr(4, 2), 16);
            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
            document.body.classList.add('has-light-background');
        } else {
            document.body.classList.add('has-dark-background');
        }

        // default options to init reveal.js
        const defaultOptions = {

            progress: true,
            history: true,

            },
