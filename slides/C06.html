    <script type="text/javascript">
        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };
    </script>

**Performance & Audiovisual Art** Live coding is most established in the _livecoding music and visuals_ scene. Artists use environments like TidalCycles, SuperCollider, Sonic Pi, or Hydra to improvise generative music and visuals in real time, often projecting their code as part of the performance. _This is a legitimate professional performance art form with international festivals_.

**Interactive Installations** Computational artists frequently use live coding during the _development and tuning_ phase of installations.

**Creative Coding Workshops & Education** Teaching live coding is itself a professional skill. Artists are hired to run workshops at institutions, festivals, and residencies. Demonstrating code as a performative act is an effective and engaging pedagogical tool.

**Generative Design & Motion Graphics** In commercial creative work, live coding tools allow designers to iterate visually in real time. Studios value artists who can work this way because it speeds up prototyping and opens up more expressive possibilities.

**Data Visualization & Research Art** Artists working at the intersection of data and aesthetics use live coding to explore datasets dynamically. This is common in artist residencies at research institutions or in journalism/design hybrid roles.

**Collaborative and Networked Performance** Platforms like Estuary and Flok allow multiple performers to code together simultaneously, enabling networked live coding collaborations across cities or countries → useful for commissions, online performances, and experimental festivals.

**Game Design & Procedural Systems** Some independent game artists and demo scene creators use live coding environments to build procedural worlds and mechanics, especially in tools with REPL-driven workflows (Clojure with Quil, Lua-based engines, etc.).

## What is MIDI?

MIDI is a **communication protocol** — not audio.

Think of it like sheet music:

| Sheet Music       | MIDI              |
| ----------------- | ----------------- |
| "Play C4"         | Note ON, pitch 60 |
| "Play it loud"    | Velocity 127      |
| "Hold for 1 beat" | Note duration     |
| "Use the piano"   | Program Change    |

> MIDI tells instruments **what to do**, not **what to sound like**.

        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            let hex = color.replace('#', '');

            // convert #fff => #ffffff
            if (hex.length == 3) {
                hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
            }

            const c_r = parseInt(hex.substr(0, 2), 16);
            const c_g = parseInt(hex.substr(2, 2), 16);
            const c_b = parseInt(hex.substr(4, 2), 16);
            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
            document.body.classList.add('has-light-background');
        } else {
            document.body.classList.add('has-dark-background');
