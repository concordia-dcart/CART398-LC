    <script type="text/javascript">
        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };
    </script>

## The Modular Synthesis Analogy

Hydra mirrors **modular synthesis** — but in code:
```
source → transforms → output
osc()   .rotate()    .out()
```

- **Source** = signal generator (oscillator, noise, shape...)
- **Transform** = module (geometry, color, effects)
- **out()** = speaker / monitor output

> Functions are connected with `.` (dot notation)  
> <br>
>  Arguments = knob positions

## Your First Patch
```js
osc().out()
```

Add parameters:
```js
osc(10, 0.1, 0.5).out()
// osc(freq, sync, offset)
```
freq determines the frequency (i.e., how packed the stripes are), the second the sync (i.e., the scroll speed), and the third the offset, which adds color to the pattern.


Chain a transform:
```js
osc(10, 0.1, 0.5).rotate(0.5).out()
```

Keep adding:
```js
osc(10, 0.1, 0.5).rotate(0.5).pixelate(20, 20).out()
```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 1200px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Function Types

| Type | Role | Example |
|------|------|---------|
| **Source** | Generates signal | `osc()`, `noise()` |
| **Geometry** | Transforms spatial coords | `.rotate()`, `.kaleid()` |
| **Color** | Transforms color values | `.color()`, `.contrast()` |
| **Blend** | Combines two sources (color) | `.blend()`, `.add()` |
| **Modulate** | Uses one source to warp another | `.modulate()`, `.modulateRotate()` |
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 1200px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Sources

### `osc(frequency, sync, offset)`
Visual oscillator — stripes going from black to white.
```js
osc(60, 0.1, 0).out()
```

### `solid(r, g, b, a)`
Flat color fill.
```js
solid(1, 0, 0).out()  // solid red
```

### `noise(scale, offset)`
2D Perlin noise — organic texture.
```js
noise(10, 0.1).out()
```

> ⚠️ `noise` outputs both positive and negative values
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 1200px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## More Sources

### `voronoi(scale, speed, blending)`
Cellular / Voronoi diagram shapes.
```js
voronoi(5, 0.3, 0.3).out()
```

### `shape(sides, radius, smoothing)`
Simple polygons.
```js
shape(3, 0.3, 0.01).out()   // triangle
shape(6, 0.4, 0.01).out()   // hexagon
```

### `gradient(speed)`
Gradient that cycles through colors.
```js
gradient(0.5).out()
```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 1200px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Geometry Transforms

Chain after any source:
```js
osc(10).rotate(Math.PI / 4).out()    // rotate 45°
osc(10).kaleid(6).out()              // kaleidoscope
osc(10).pixelate(20, 20).out()       // pixelate
osc(10).repeat(3, 3).out()           // tile
osc(10).scale(0.5).out()             // scale
```

> All geometry transforms have a corresponding **modulate** version:
> `.rotate()` → `.modulateRotate()`
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 1200px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Outputs

Hydra has **4 virtual buffers**: `o0`, `o1`, `o2`, `o3`
```js
osc().out()          // renders to o0 (default)
osc().out(o1)        // renders to o1
shape().out(o2)      // renders to o2

render()             // shows all 4 outputs split-screen
render(o2)           // shows o2 fullscreen
```

> Trick: prepare multiple buffers, switch between them live
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 1200px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## External Sources: Webcam
```js
s0.initCam()         // initialize camera into source slot s0
src(s0).out()        // pipe it to screen
```

Add transforms:
```js
s0.initCam()
src(s0).rotate(0.1).kaleid(4).out()
```

Multiple cameras:
```js
s0.initCam(0)
s1.initCam(1)
```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 1200px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Blending

Combine two sources by **color**:
```js
osc(10).out(o0)
shape(4).out(o1)

src(o0).blend(o1, 0.5).out()
```

Other blend modes: `.add()`, `.mult()`, `.diff()`, `.layer()`

> Similar to Photoshop/GIMP blend modes
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 1200px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Modulation

Use one source to **warp the geometry** of another:
```js
osc(10).out(o0)
noise(3).out(o1)

src(o0).modulate(o1, 0.1).out()
// noise displaces the oscillator's pixel coordinates
```

- Red channel → X displacement
- Green channel → Y displacement
- Does **not** change color/luminosity — only geometry
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 1200px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Modulation vs Blending

| | Blending | Modulation |
|-|---------|-----------|
| What combines | **Colors** | **Coordinates** |
| Result | Mix of colors | Warping / distortion |
| Example | `.blend(o1)` | `.modulate(o1)` |
| Analogy | Mixing paint | Looking through warped glass |
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 1200px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Errors & Comments

**Errors** appear in red at the bottom-left of the screen:
```
Unexpected token '.'
```
Usually a typo or syntax issue. Fix it and re-run.

**Comments** — ignored by the engine:
```js
// This is a comment — great for notes during a performance
osc(10).out()  // you can also comment inline
```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->

        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            let hex = color.replace('#', '');

            // convert #fff => #ffffff
            if (hex.length == 3) {
                hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
            }

            const c_r = parseInt(hex.substr(0, 2), 16);
            const c_g = parseInt(hex.substr(2, 2), 16);
            const c_b = parseInt(hex.substr(4, 2), 16);
            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
