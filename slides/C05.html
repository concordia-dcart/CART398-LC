    <script type="text/javascript">
        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };
    </script>

notes: 

Eamon: very nice melodies. Good use of envelopes to control synth sounds and modifiers to control variation. Good documentation of the patch. Perhaps working on the mix?

Emma: very nice mood and harmony generation using melodic patterns and transformation. Perhaps work a bit more by placing sounds in the stereof field.

Hanif: Still trying LLM for this? If so, you should try strudel MCP server (https://github.com/williamzujkowski/strudel-mcp-server)

Hubert: Very nice melodies and dark mood. Note than range of panning is [0, 1]. Good exploration of reverb with room and size. Good attempt at controlling values for a good mix

Jashim:  Almost fully formed track with reggaeton beat (and sounds from our repo!). Great use of gain to control levels and use of scales.

Leo: Great research on filters and compressors. Perhaps bass2 clashes with bass1 (even if using the same scale)

Nicolas: Almost modular-sounding patch. Some of the lines almost don't make any sound (e.g., the second in the stack) Make sure all patterns are there for a reason! Also don't need to use backticks if mininotation in a single line, as in the last two lines.

Nisma: Interesting use of the mask with probability to add variability

Skyla: Great use of `arrange` for creating structures and `when` for adding variation. E.g., check `Heartbeat`

Tara: interesting use of samples using `splice`. When listeniing to stuck low frequency notes, double-check the functions you are using → In your case the `fft()` in line 38 shouldn't be there or have an argument

Terence: interesting use of modifiers such as `jux(rev)` for variability and stereo. some lines such as `8: chooseCycles` aren't doing anything.

Uandha: Excellent groove and mix. Great use of `every` for periodic variability and `slice` and `euclidRot` for more variabillity (mute/unmute line 22) 

Aalok: Interesting take on army of me by bjork. Good use of distortion to approach the sound. Don't need to add `scale` when using note names. When using `chord` you should use `voicing` and uppercase chord names `C Eb F`

Bea: Lovely minimal piece. Would be great to add more modifiers so that is constantly changing and less monotonous.

Bianca: 
Some lines (`17` are not even played). Work on adding variabilty to your patches.

Cathy: Atmospheric piece. Double-check your `scale` choices and usage so that all patterns sound more cohesive.

Celine: Good use of `scrub` to target specific sections of sample (line 20) and use of `mask` for variability. Some sounds are not loaded (line 18). What does `loop(2)` mean on line 23? (2 doesn't make sense)

Clarence: Excellent ambiance and use of modifiers for variability!  First `samples()` doesn't work!

## Serving your own sounds for Strudel

Loading sounds one by one can be time-consuming

Not really efficient for live coding!

It is sometimes better to consolidate all your sounds on a single repository that you can re-use!

You can put your audio files in a web-accesible repository with a well-defined structure to reach your sounds (e.g., all sounds of a certain type inside a subfolder)

For example, the [tidal-drum machines](https://github.com/geikha/tidal-drum-machines/tree/main/machines) or the [Dirt-Samples](https://github.com/tidalcycles/Dirt-Samples) repositories.

A sample map is needed where you state which sample names exist (when you type in `s("...")`) and which audio files each name points to  (plus a `_base` URL).

```json
{
  "_base": "https://example.org/my-samples/",
  "bd": ["bd/01.wav", "bd/02.wav"],
  "hh": "hh/closed.wav",
  "sd": ["sd/a.wav", "sd/b.wav"]
}

```

After loading that, you can select the samples by name, and their variants with `:` (zero-based), e.g. `s("bd:0 bd:1 sd:0")`.

You can store this sample map in a `strudel.json` file and serve it in the root of the repository

When loading the repo in Strudel using `samples( ... )`, it will search for the JSON file and read the mappings!

## ICA — 1. Your own sound repository for Strudel

In this exercise, you will create your own sound repository on Github.

You will:

1. Record or collect four to six sounds (at least)
2. Organize them in folders
3. Create a repository on Github and clone it to your computer
4. Move the sounds into the local repository
5. Generate the `strudel.json` mapping file (with the `_base` URL info of your repo)
6. Commit and push the changes
7. Make some patterns and enjoy!

PS: Read the instructions in the README file of the template repository

    <script>
        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            let hex = color.replace('#', '');

            // convert #fff => #ffffff
            if (hex.length == 3) {
                hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
            }

            const c_r = parseInt(hex.substr(0, 2), 16);
            const c_g = parseInt(hex.substr(2, 2), 16);
            const c_b = parseInt(hex.substr(4, 2), 16);
            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
            document.body.classList.add('has-light-background');
        } else {
            document.body.classList.add('has-dark-background');
        }

        // default options to init reveal.js
        const defaultOptions = {
            controls: true,
            progress: true,
            history: true,
            center: true,
            transition: 'default', // none/fade/slide/convex/concave/zoom

            },

            },
        };

        if ( pageInIframe() ) {

        // options from URL query string
