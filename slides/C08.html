    <script type="text/javascript">
        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };
    </script>

## What are color transforms?

Color transforms **operate on the RGB values** of each pixel — they shift, scale, and remap the output of a source or chain

```
source → geometry → color transform → .out()
osc()   .rotate()   .brightness(0.5)   .out()
```

> Unlike geometry transforms, color transforms don't move pixels — they change their values

### `.brightness()` & `.contrast()`
```js
brightness( amount = 0.4 )
contrast( amount = 1.6 )
```

`.brightness()` shifts luminance. Values > 0 brighten, < 0 darken.
`.contrast()` stretches or compresses the tonal range.

```js
osc(10, 0.1, 1).brightness(0.5).out()       // brighter
osc(10, 0.1, 1).brightness(-0.3).out()      // darker

osc(10, 0.1, 1).contrast(3).out()           // high contrast
osc(10, 0.1, 1).contrast(0.2).out()         // washed out

osc(10, 0.1, 1).brightness(0.2).contrast(2).out()  // chain them
```

### `.saturate()` & `.hue()`
```js
saturate( amount = 2 )
hue( amount = 0.4 )
```

`.saturate()` controls color intensity. 0 = grayscale, > 1 = vivid.
`.hue()` rotates the hue wheel (0–1 = full rotation).

```js
osc(10, 0.1, 1).saturate(5).out()           // hyper-saturated
osc(10, 0.1, 1).saturate(0).out()           // grayscale

osc(10, 0.1, 1).hue(0.5).out()              // 180° hue rotation
osc(10, 0.1, 1).hue(() => time * 0.1).out() // hue cycling over time
```

### `.colorama()` & `.color()`
```js
colorama( amount = 0.005 )
color( r, g, b, a )
```

`.colorama()` shifts all channels by the same small amount — creates prismatic/rainbow splitting.
`.color()` multiplies each channel independently — tints the output.

```js
osc(10, 0.1, 1).colorama(0.1).out()                    // prismatic shift
osc(10, 0.1, 1).colorama(() => Math.sin(time) * 0.2).out()  // animated

osc(10, 0.1, 1).color(1, 0, 0).out()                   // red tint
osc(10, 0.1, 1).color(0, 1, 1).out()                   // cyan tint
noise(3).color(1, 0.5, 0).out()                        // warm noise

## What are blend functions?

Blend functions **combine two textures pixel-by-pixel** using a mathematical operation

```
source.blend_function( other_source, amount ).out()
osc()  .add(          noise(),        0.5   ).out()
```

- The **calling source** is texture A
- The **argument** is texture B
- `amount` controls the mix weight (0–1)

> Think of these as the **mixer** in your modular rack

| Function | Operation | Effect |
| -------- | --------- | ------ |
| `.add()` | A + B | Brightens; can blow out |
| `.mult()` | A × B | Darkens; masks dark areas |
| `.diff()` | \|A − B\| | High contrast edge detection |
| `.blend()` | lerp(A, B, t) | Smooth crossfade |
| `.layer()` | alpha composite | B over A using alpha channel |

shape(4, 0.3, 0.01).color(1, 0, 0, 1)

## What is modulation?

Modulation uses **one texture's luminance values to displace the coordinate space** of another — the equivalent of frequency modulation (FM) but for visuals

```
source.modulate( modulator, amount ).out()
osc()  .modulate( noise(),   0.1   ).out()
```

- The **modulator**'s pixel values become UV offsets
- Higher `amount` = more displacement
- Result: organic, glitchy, liquid distortions

> This is the **core power move** in Hydra

### `.modulate()`
```js
modulate( texture, amount = 0.1 )
```

The modulator's pixel brightness warps the coordinates of the source.
```js
osc(10, 0.1, 1).modulate(noise(3), 0.1).out()     // organic warp
osc(10, 0.1, 1).modulate(osc(3), 0.05).out()      // oscillator warp
osc(10, 0.1, 1).modulate(osc(3, 0), 0.5).out()    // static displacement

// cross-modulation: two sources modulating each other
osc(10, 0.1, 1).out(o1)
noise(3).modulate(o1, 0.1).out()
```

> 🔑 This is the most versatile function in Hydra

##### `.modulateRotate()`

osc(10, 0.1, 1).modulateRotate(noise(2), 2).out()    // liquid rotation

```js
osc(10, 0.1, 1).modulateScale(noise(2), 2).out()
osc(10, 0.1, 1).modulateScale(shape(4, 0.3, 0.01), 3).out()
```

##### `.modulateScrollX()` / `.modulateScrollY()`
Scrolls coordinates using texture values.
```js

### `.kaleid()`
```js
kaleid( nSides = 4 )
```

Folds the texture into a kaleidoscopic mirror — creates `nSides` reflections.
```js
osc(10, 0.1, 1).kaleid(3).out()   // 3-fold
osc(10, 0.1, 1).kaleid(6).out()   // 6-fold
noise(3).kaleid(P("3 4 6 8")).out() // pattern-driven sides

// classic combo: modulate + kaleid
noise(3)
  .modulate(osc(3), 0.1)
  .kaleid(6)
  .out()
```

> `.kaleid()` is most powerful after a `.modulate()` — the warp gets reflected symmetrically

### `.repeat()` & `.scrollX()` / `.scrollY()`
```js
repeat( repeatX = 3, repeatY = 3, offsetX, offsetY )
scrollX( scrollX = 0.5, speed )
scrollY( scrollY = 0.5, speed )
```

```js
// repeat: tile the texture
osc(10, 0.1, 1).repeat(3, 3).out()
shape(4, 0.5, 0.01).repeat(4, 4, 0.5, 0).out()
shape(4, 0.5, 0.01).repeat(4, 4)
  .modulate(noise(2), 0.05).out()

// scrollX / scrollY: shift coordinates
osc(10, 0.1, 1).scrollX(0.5).out()               // static offset
osc(10, 0.1, 1).scrollX(0, 0.1).out()            // continuous scroll
osc(10, 0.1, 1)
  .scrollX(() => time * 0.1)
  .scrollY(() => time * 0.05)
  .out()
```

## Putting it all together

A complex patch uses the full chain:

```js
// source → geometry → modulate → color → blend → out
noise(3, 0.1)
  .modulate(osc(3, 0.05), 0.1)  // warp with oscillator
  .kaleid(6)                      // fold symmetrically
  .color(1, 0, 0.5)               // tint magenta
  .add(
    osc(20, 0.1, 1)               // add a second source
      .rotate(() => time * 0.2)
      .mult(shape(4, 0.6, 0.01))
    , 0.5
  )
  .out()
```

> <mark>Read the chain left to right</mark> — each step feeds into the next

            const target = {};
            for (let i = 0; i < arguments.length; i++) {

        function isLight(color) {
            let hex = color.replace('#', '');

            // convert #fff => #ffffff
            if (hex.length == 3) {
                hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;

            const c_r = parseInt(hex.substr(0, 2), 16);

            const c_b = parseInt(hex.substr(4, 2), 16);
            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
