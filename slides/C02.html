    <script type="text/javascript">
        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };
    </script>

## Today's session — *Collaborative groove lab*

Sound sources: selecting banks and loading external samples

More on mini-notation grammar, nesting, alternation, Euclidean rhythms. 

Ensemble coordination, call-and-response, phrase, variation, syncopation, polymetric implication through grouping, listening as constraint. 

Strudel functions/syntax: mini-notation deeper (`<>` alternation, `?` probability, `$:` multiple patterns running in parallel; `_$/` as quick muting for arrangement.)

Transformations: Euclidean rhythm (`(p,s)` forms and `euclid`), `.struct`, `.mask`, `.every(n, fn)` (and other transformations). 

Tools: Flok REPL for collaborative performances.

## More on mini-notation


### Random choices with `?` 

Randomness provides a quick way to introduce variety into a sequence. 

Events with a ”?” placed after them will have a 50% chance of being removed from the pattern.

Adding a number between 0 and 1 after the ”?” will affect the likelihood of the event being removed. For example, events with “?0.2” placed after them will have a 20% chance of being removed:

Euclidean rhythms in traditional music

<div class="block">

<!-- .element: style="font-size: 14px" -->
(2,5) : A thirteenth century Persian rhythm called Khafif-e-ramal.<br>
(3,4) : The archetypal pattern of the Cumbia from Colombia, as well as a Calypso rhythm from Trinidad.<br>
(3,5,2) : Another thirteenth century Persian rhythm by the name of Khafif-e-ramal, as well as a Rumanian folk-dance rhythm.<br>
(3,7) : A Ruchenitza rhythm used in a Bulgarian folk-dance.<br>
(3,8) : The Cuban tresillo pattern.<br>
(4,7) : Another Ruchenitza Bulgarian folk-dance rhythm.<br>
(4,9) : The Aksak rhythm of Turkey.<br>
(4,11) : The metric pattern used by Frank Zappa in his piece titled Outside Now.<br>
(5,6) : Yields the York-Samai pattern, a popular Arab rhythm.<br>
(5,7) : The Nawakhat pattern, another popular Arab rhythm.<br>
(5,8) : The Cuban cinquillo pattern.<br>
(5,9) : A popular Arab rhythm called Agsag-Samai.<br>
(5,11) : The metric pattern used by Moussorgsky in Pictures at an Exhibition.<br>
(5,12) : The Venda clapping pattern of a South African children’s song.<br>
(5,16) : The Bossa-Nova rhythm necklace of Brazil.<br>
(7,8) : A typical rhythm played on the Bendir (frame drum).<br>
(7,12) : A common West African bell pattern.<br>
(7,16,14) : A Samba rhythm necklace from Brazil.<br>
(9,16) : A rhythm necklace used in the Central African Republic.<br>
(11,24,14) : A rhythm necklace of the Aka Pygmies of Central Africa.<br>
(13,24,5) : Another rhythm necklace of the Aka Pygmies of the upper Sangha.<br>
</div>

### `$:` (parallel streams)

- Each pattern is independent
    
- Easy to mute, solo, or replace
    
- Best for live performance and improvisation
    

### `stack()` (single composite pattern)

- Patterns are structurally bound together
    
- Transformations can apply to _all layers at once_
    
- Best for formal composition and macro-shaping

### Density bursts

`.every(4, x => x.fast(2))`

### Register or pitch shifts

`.every(3, x => x.add(7))`

### Structural mutation

`.every(5, x => x.struct("x ~ x x"))`

        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            let hex = color.replace('#', '');

            // convert #fff => #ffffff
            if (hex.length == 3) {
                hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
            }

            const c_r = parseInt(hex.substr(0, 2), 16);
            const c_g = parseInt(hex.substr(2, 2), 16);
            const c_b = parseInt(hex.substr(4, 2), 16);
            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();
