    <script type="text/javascript">
        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };
    </script>

## Joana Chicau
🔗 [joanachicau.com](https://joanachicau.com)

- Graphic designer, programmer, researcher, and dance artist
- Work lives at the intersection of **choreography, web technologies, and performance**
- Developed *ChoreoGraphic Coding* — a hybrid vocabulary linking post-modern dance with web functions
- Performances at IRCAM, NMF, ISEA, TOPLAP, ICLC, and beyond



notes:

Joana Chicau trained in classical ballet in Porto, then studied media design at the Piet Zwart Institute in Rotterdam. There she began mapping abstract choreographic language onto UX and web code.

## The Core Idea

> *"The computer screen is divided in two stages: the **frontstage**, the interface a user normally accesses, and the **backstage** — the web console — in which programming languages can be run."*
> — Joana Chicau

In the backstage, she calls, juxtaposes, and manipulates functions named after **choreographic concepts** — while simultaneously displaying the outcomes on the frontstage

The page, originally filled with information, is deconstructed — moved, removed, transformed — ending with a minimal, post-performance layout

## Frontstage / Backstage

| Frontstage | Backstage |
| ---------- | --------- |
| What the audience sees | Where the performer works |
| The rendered webpage | The browser developer console |
| HTML elements, images, text | JavaScript live coding |
| The score as embodied | The score being written |

Open dev tools: `F12` or `Cmd+Opt+I` → **Console** tab

> Any webpage becomes a performance space — <mark>Wikipedia, a newspaper, a museum site, ...</mark>

## What is the DOM?

The **Document Object Model** is the live, in-memory tree of every element on a webpage — the score of the performance

```
document
  └── html
        ├── head
        └── body
              ├── h1         ← can be selected, moved, styled
              ├── p          ← can be addressed, animated
              ├── img        ← can be rotated, flipped, removed
              └── a          ← can be transformed at will
```

> The DOM is not the HTML file — it is the living body of the page, mutable in real time

## `document.querySelectorAll()`

Selects **all elements matching a CSS selector** — returns a NodeList:

```js
document.querySelectorAll("*")        // every element
document.querySelectorAll("p")        // all paragraphs
document.querySelectorAll("img")      // all images
document.querySelectorAll("h1, h2")   // all headings
document.querySelectorAll("a")        // all links
```

Loop through them with `.forEach()`:
```js
document.querySelectorAll("p").forEach(el => {
  el.style.color = "red";
});
```

> `.forEach()` visits each node — treat it as <mark>iterating through the cast of performers</mark>

## `element.style` — inline CSS

Any CSS property can be set via JavaScript:

```js
el.style.fontSize = "48px";
el.style.color = "red";
el.style.transform = "rotate(45deg)";
el.style.transition = "all 0.5s ease";
el.style.opacity = "0.3";
el.style.display = "none";        // hide element
el.style.visibility = "hidden";   // invisible but still takes space
```

camelCase in JS = kebab-case in CSS:

| CSS property | JS equivalent |
| ------------ | ------------- |
| `font-size` | `fontSize` |
| `background-color` | `backgroundColor` |
| `border-radius` | `borderRadius` |
| `z-index` | `zIndex` |

## `setInterval()` — repeating actions

```js
setInterval( callback, milliseconds )
```

Calls `callback` every `milliseconds` milliseconds — this is the **temporal score**:

```js
// execute something every 300ms
setInterval(() => {
  // your choreography here
}, 300);

// store the ID to stop it later
const id = setInterval(() => {
  // ...
}, 500);

// stop a specific interval
clearInterval(id);
```

> `setInterval` is the **tempo** of the performance — 300ms ≈ a fast stuttering, 2000ms ≈ slow breathing

## Stopping a performance

```js
// nuclear option: clear ALL intervals
let id = setInterval(() => {}, 9999);
for (let i = 0; i <= id; i++) clearInterval(i);

// reset inline styles on all elements
document.querySelectorAll("*").forEach(el => {
  el.removeAttribute("style");
});

// remove injected style tags (tag them first!)
document.querySelectorAll("style[data-live]").forEach(s => s.remove());
```

> Always know how to stop — this is stage management. <mark>Add `data-live` to every `<style>` tag you inject</mark>

## Font Chaos
```js
// randomize font size of every element, every 300ms
setInterval(() => {
  [...document.querySelectorAll("*")].forEach(el => {
    const size = Math.floor(Math.random() * 40) + 8;
    el.style.fontSize = size + "px";
  });
}, 300);
```

What this does:
- `[...]` — spreads NodeList into an array (needed for `.forEach` on all elements)
- `Math.random() * 40 + 8` — random size between **8–48px**
- `el.style.fontSize` — applied inline, overrides the page's own CSS
- Runs every **300ms** — a rapid, jittery typographic collapse

> <mark>Type this in the console</mark> of any page with text — every element starts breathing at its own size

## Injecting CSS Keyframes into `<head>`

We write **CSS animations** directly into the `<head>` — the score — at runtime:

```js
const style = document.createElement("style");
style.setAttribute("data-live", "");      // mark for easy cleanup
style.textContent = `
img {
  animation: flipXY 1.5s linear infinite;
}
@keyframes flipXY {
  0%   { transform: rotateX(0deg)   rotateY(0deg); }
  50%  { transform: rotateX(180deg) rotateY(180deg); }
  100% { transform: rotateX(360deg) rotateY(360deg); }
}
`;
document.head.appendChild(style);   // ← inserts into <head>
```
<!-- .element: style="font-size: 0.8em" -->


> This is the most literal enactment of Chicau's `<head>`/`<body>` observation:  
> 
> we are **adding new rules to the score** (`<head>`) that immediately govern **all performers** (`<body>`)

const style = document.createElement("style");

  const patterns = {
    float:   n => `@keyframes ${n}{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}`,
    shake:   n => `@keyframes ${n}{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}`,
    wobble:  n => `@keyframes ${n}{0%,100%{transform:rotateZ(0deg)}50%{transform:rotateZ(2deg)}}`,
    stretch: n => `@keyframes ${n}{0%,100%{transform:scale(1)}50%{transform:scale(10.05)}}`,
    tilt:    n => `@keyframes ${n}{0%,100%{transform:rotateY(0deg)}50%{transform:rotateY(20deg)}}`,
    bounce:  n => `@keyframes ${n}{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-15px)}}`
  };
  const keys = Object.keys(patterns);
  elements.forEach((el, i) => {
    const name = `tx_${i}`;
    const pattern = keys[Math.floor(Math.random() * keys.length)];
    const dur = (Math.random() * 10 + 1.5).toFixed(2);
    css += patterns[pattern](name);
    css += `[data-tx="${i}"]{display:inline-block;animation:${name} ${dur}s infinite ease-in-out;}`;
    el.setAttribute("data-tx", i);
  });
  style.textContent = css;
  document.head.appendChild(style);    // ← new score, injected live
})();

## From editor to <`script`> tag

So far we've used Strudel inside a REPL — a hosted editor environment

But `@strudel/web` is a **standalone JavaScript package** that loads via a single <`script`> tag

```html
<!doctype html>
<script src="https://unpkg.com/@strudel/web@latest">__SCRIPT_END__
```

This one line makes the entire Strudel runtime available in your page:
- All mini-notation pattern functions: `sound()`, `note()`, `stack()`, `s()`, ...
- `initStrudel()` — initialises the audio context
- `samples()` — loads sample banks (TidalCycles dirt-samples or custom)
- `evaluate(codeString)` — evaluates a Strudel pattern from a JS string
- `hush()` — stops all patterns

## [Minimal Strudel page](https://github.com/vigliensoni/strudel-pie/blob/main/starter-code/strudel.html)

```html
<html>
	<head>
		<script src="https://unpkg.com/@strudel/web@latest">__SCRIPT_END__
	</head>
<body>

	<button id="play">play</button>
	<button id="stop">stop</button>
	
	<script>
		// 1. initialise the engine
		const ready = initStrudel();
		
		// 2. load samples once the engine is ready
		ready.then(() => samples('github:tidalcycles/dirt-samples'));
		
		// 3. wire up controls
		document.getElementById("play").onclick = async () => {
			await ready;
			evaluate(`s("casio:0*6 casio:1")`);
			};
		
		document.getElementById("stop").onclick = async () => {
			await ready;
			evaluate(`hush()`);
			};
	
	__SCRIPT_END__
</body>
</html>
```

const hydra = new Hydra({ detectAudio: false })

## Minimal Hydra page

```html
<!doctype html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; }
    body { background: black; overflow: hidden; }
    canvas { width: 100vw; height: 100vh; display: block; }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <script src="https://unpkg.com/hydra-synth">__SCRIPT_END__
  <script>
    // 1. instantiate Hydra, point it at our canvas
    var hydra = new Hydra({
      canvas: document.getElementById("canvas"),
      detectAudio: false
    });

    // 2. write patches exactly as in the editor
       osc(12, -0.05, 1.5)
      .kaleid(4)
      .modulate(noise(1), 0.1)
      .out();
  __SCRIPT_END__

</body>
</html>
```

## The challenge: namespace conflict

Strudel and Hydra both inject many global functions — some share names

The clean solution: **isolate Hydra in an `<iframe>`**

```
index.html                    hydra.html
┌─────────────────────┐       ┌──────────────────────┐
│  @strudel/web       │       │  hydra-synth          │
│                     │  ───▶ │  <canvas>             │
│  play / stop / BPM  │  src= │  osc().kaleid().out() │
│  <buttons>          │       │                       │
└─────────────────────┘       └──────────────────────┘
        ▲ sound                        ▲ visuals
```

- Each frame has its own global scope — no name collisions
- Hydra's canvas fills the entire viewport via CSS
- Strudel lives in the parent page and controls audio
- The two are effectively **two instruments playing together**, embedded in one URL

    <script>
        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            let hex = color.replace('#', '');

            // convert #fff => #ffffff
            if (hex.length == 3) {
                hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
            }

            const c_r = parseInt(hex.substr(0, 2), 16);
            const c_g = parseInt(hex.substr(2, 2), 16);
            const c_b = parseInt(hex.substr(4, 2), 16);
            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
            document.body.classList.add('has-light-background');
        } else {
            document.body.classList.add('has-dark-background');
        }

        // default options to init reveal.js
        const defaultOptions = {
            controls: true,
            progress: true,
            history: true,
            center: true,
            transition: 'default', // none/fade/slide/convex/concave/zoom
            plugins: [
                ObsidianMarkdown,
                RevealHighlight,
                RevealZoom,
                RevealNotes,
                RevealMath.KaTeX,
                RevealMermaid,
                RevealChart,
                RevealCustomControls,
            ],
            allottedTime: "120",

            katex: {
                local: 'plugin/math/katex',
                extensions: ["mhchem"],
            },
            markdown: {
                gfm: true,
            },
            mermaid: {
                theme: isLight(bgColor) ? 'default' : 'dark',
            },
            customcontrols: {
                controls: [
                ]
            },
        };

        if ( pageInIframe() ) {
            defaultOptions.scrollActivationWidth = 5;
        }

        // options from URL query string
        const queryOptions = Reveal().getQueryHash() || {};
