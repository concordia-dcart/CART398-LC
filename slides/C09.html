    <script type="text/javascript">
        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };
    </script>

## Source Buffers

Hydra has **4 external source buffers**: `s0`, `s1`, `s2`, `s3`

These can capture live input from camera, screen, or video

```js
s0.initCam()        // webcam → s0
s1.initScreen()     // screen capture → s1
s2.initVideo(url)   // video file / stream → s2
```

Once initialized, use `src()` to pull them into your patch:
```js
src(s0).out()
src(s0).contrast(1.5).out()
src(s0).modulate(noise(3), 0.05).out()
```

> Source buffers are fully compatible with all transforms, blends, and modulations

### Camera: `s0.initCam()`
```js
s0.initCam()             // default camera (index 0)
s0.initCam(1)            // second camera (e.g., external)
```

Once active, treat it like any source:
```js
// raw camera
src(s0).out()

// color-shifted camera
src(s0).hue(0.5).saturate(2).out()

// camera as modulator (the camera warps an oscillator)
osc(10, 0.1, 1).modulate(src(s0), 0.05).out()

// synth over camera (blend)
src(s0).blend(osc(10, 0.1, 1), 0.3).out()

// camera driving a feedback loop
src(s0).diff(o0).out(o0)
```

## The `a` object — FFT analyser

Hydra exposes an audio analyser via the `a` object — it reads from the microphone or system audio

```js
a.show()           // overlay FFT visualization
a.hide()           // remove the overlay
```

Configuration:
```js
a.setBins(4)       // number of frequency bins (default: 4)
a.setSmooth(0.9)   // smoothing 0–1 (default: 0.4)
a.setCutoff(2)     // noise floor — values below this → 0
a.setScale(5)      // output amplitude scaling
```

Values accessed as:
```js
a.fft[0]  // bin 0 — typically sub-bass
a.fft[1]  // bin 1 — bass / low-mids
a.fft[2]  // bin 2 — mids
a.fft[3]  // bin 3 — highs
```

### Using FFT values in a patch

Each `a.fft[n]` returns a value from **0 to 1** — wrap in an arrow function:

```js
a.setBins(4)
a.setSmooth(0.4)
a.setCutoff(5)
a.setScale(5)

// frequency drives oscillator frequency
osc(
  () => a.fft[0] * 60 + 10,   // bass → freq
  0.01,
  () => a.fft[2] * 2           // mids → offset
).out()

// shape pulsing with the beat
shape(5, () => a.fft[0] * 0.5 + 0.1, 0.01)
  .color(() => a.fft[1], 0.5, () => a.fft[3])
  .scale(1, 9/16)
  .out()
```

### Audio + complex chains
```js
a.setBins(4)
a.setSmooth(0.85)
a.setCutoff(5)
a.setScale(1)

noise(() => a.fft[0] * 30 + 3)
  .modulate(osc(3, 0.1), () => a.fft[1] * 0.2)
  .kaleid(() => Math.floor(a.fft[2] * 8) + 3)
  .color(() => a.fft[0], () => a.fft[2], () => a.fft[3])
  .out()

```

## What is feedback?

Feed the **output of a buffer back into itself** as a source — each frame builds on the previous one

```js
// render to o0, read from o0 in the next frame
osc(10, 0.1, 0.5)
  .modulate(o0, 0.01)    // previous frame as modulator
  .rotate(0.002)
  .out(o0)               // write back to same buffer
```

> Feedback creates **trails, smears, infinite zoom, and ghosting** effects
>
> Small values (`0.001–0.01`) = subtle trails  ·  large values = chaotic accumulation

### Feedback recipes

**Trail / persistence:**
```js
// blend current frame with previous — persistence of vision
osc(10, 0.1, 0.5)
  .blend(o0, 0.85)       // 85% of previous frame + 15% new
  .out(o0)
```

**Zoom feedback:**
```js
src(o0)
  .scale(1.005)          // tiny zoom each frame
  .rotate(0.001)
  .blend(osc(10, 0.1, 1), 0.02)
  .out(o0)
```

**Difference feedback (glitch):**
```js
src(s0)                  // camera input
  .diff(o0)              // xor with previous frame
  .out(o0)
```

> Use `solid(0).out(o0)` to <mark>clear a feedback buffer</mark> before starting a new patch

## Global variables

Hydra exposes several live variables accessible anywhere via arrow functions:

| Variable | Type | Description |
| -------- | ---- | ----------- |
| `time` | Number | Seconds elapsed since load |
| `mouse.x` / `mouse.y` | Number | Cursor position in pixels |
| `width` / `height` | Number | Canvas dimensions |
| `bpm` | Number | Beats per minute (set manually) |

// time-based parameter modulation
osc(10, 0.1, 1).rotate(() => Math.sin(time) * 0.5).out()

// normalize mouse.x to 0–1
osc(10, 0.1, 1)
  .rotate(() => mouse.x / width * Math.PI * 2)
  .scale(() => mouse.y / height + 0.5)
  .out()
```

### `setInterval()` — timed automation
```js
setInterval( callback, milliseconds )
```

Schedule parameter changes at regular intervals — useful for structured variation during performance:

```js
var params = { freq: 10, sides: 4, color: [1, 0, 0] }

// change frequency every 2 seconds
setInterval(() => {
  params.freq = Math.random() * 60 + 5
}, 2000)

// change shape sides every 4 beats
setInterval(() => {
  params.sides = [3, 4, 5, 6, 8][Math.floor(Math.random() * 5)]
}, 4000)

osc(() => params.freq, 0.1, 1)
  .kaleid(() => params.sides)
  .out()
```

> `clearInterval(id)` stops a running interval — store the return value to clear it later

speed = 0.25

  .out()

// use bpm for tempo-sync

osc(10, 0.1, 1).rotate(() => time * Math.PI).out()

## `setFunction()` — custom GLSL

Add your own GLSL functions to Hydra's function set:

```js
setFunction({
  name: 'myEffect',
  type: 'color',    // 'src' | 'color' | 'combine' | 'combineCoord'
  inputs: [
    { name: 'amount', type: 'float', default: 0.5 }
  ],
  glsl: `
    vec4 myEffect(vec4 _c0, float amount) {
      return vec4(
        _c0.r * amount,
        _c0.g,
        _c0.b * (1.0 - amount),
        _c0.a
      );
    }
  `
})

// now use it like any built-in function
osc(10, 0.1, 1).myEffect(0.7).out()
```

> Four GLSL types: `src` (coord → color), `color` (color → color), `combine` (2 colors → color), `combineCoord` (coord + texture → coord)

## Preparing to perform

**Buffer management:**
- Pre-load sources before performance starts
- Use `o0`–`o3` to prepare parallel scenes
- Switch with `render(o2)` without re-evaluating patches

**Workflow:**
```js
// Layer 1 — ambient base (ready in o1)
noise(3).modulate(osc(3), 0.05).kaleid(6).out(o1)

// Layer 2 — active scene (running in o0)
osc(10, 0.1, 1).rotate(0, 0.1).out(o0)

// Live switch
render(o1)   // cut to layer 1
render(o0)   // cut back to layer 0
render()     // show all 4 — useful for monitoring
```

> Think of `o0`–`o3` as your **VJ decks** — blend between them with `src(o1).blend(src(o0), 0.5).out()`

## Live coding etiquette & resilience

**When things break:**
```js
// clear everything
hush()        // stop all outputs
solid(0).out() // black screen

// reset audio
a.hide()

// clear a specific buffer
solid(0).out(o2)
```

**Evaluate incrementally:**
- Build patches line by line
- Comment out sections with `// ` to isolate problems
- Use `render()` to see what's in each buffer

> <mark>Never delete working code during a performance — comment it out</mark>

**Transition technique:** blend between an old patch in `o1` and a new one in `o0`:
```js
src(o0).blend(src(o1), () => Math.sin(time) * 0.5 + 0.5).out()
```

    <script>
        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            let hex = color.replace('#', '');

            // convert #fff => #ffffff
            if (hex.length == 3) {
                hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
            }

            const c_r = parseInt(hex.substr(0, 2), 16);
            const c_g = parseInt(hex.substr(2, 2), 16);
            const c_b = parseInt(hex.substr(4, 2), 16);
            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
            document.body.classList.add('has-light-background');
        } else {
            document.body.classList.add('has-dark-background');
        }

        // default options to init reveal.js
        const defaultOptions = {

            history: true,

            },
